name: Deploy web demo to GitHub Pages

on:
  # Deploy main only after the Test workflow passes on that commit, and
  # build the commit it tested rather than the branch tip.
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # A workflow_run event fires for any completed Test run whose head
    # branch is main, so also require a passing run of a push (a pull
    # request from a fork's main would otherwise qualify).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Cache Zig build data
        uses: actions/cache@v4
        with:
          path: |
            .cache/zig-global
            .cache/zig-local
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-

      - name: Build web demo
        run: |
          zig build web-demo \
            -Doptimize=ReleaseFast \
            --cache-dir .cache/zig-local \
            --global-cache-dir .cache/zig-global

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build manual
        run: |
          nix develop .#ci --command mdbook build manual
          cp -r manual/book zig-out/web-demo/manual

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: zig-out/web-demo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
