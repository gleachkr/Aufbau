name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Zig build data
        uses: actions/cache@v4
        with:
          path: |
            .cache/zig-global
            .cache/zig-local
          key: zig-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            zig-${{ runner.os }}-

      - name: Check external test tools
        run: |
          nix develop .#ci --command bash -euo pipefail -c '
            command -v zig
            command -v mm0-rs
            command -v mm0-c
            command -v node
            command -v npm
            test -d third_party/mm0/examples
            zig version
            node --version
            npm --version
            mm0-rs --version

            if mm0-c >/dev/null 2>&1; then
              echo "mm0-c unexpectedly accepted no arguments" >&2
              exit 1
            fi
          '

      - name: Check release versions
        run: nix develop .#ci --command node scripts/check-version.mjs

      - name: Check formatting
        run: nix develop .#ci --command zig fmt --check build.zig src

      - name: Build native binaries
        run: |
          nix develop .#ci --command zig build \
            -Doptimize=ReleaseFast \
            --cache-dir .cache/zig-local \
            --global-cache-dir .cache/zig-global

      - name: Run complete test suite
        run: |
          nix develop .#ci --command zig build test \
            -Doptimize=ReleaseFast \
            --cache-dir .cache/zig-local \
            --global-cache-dir .cache/zig-global

      - name: Build web packages
        run: |
          nix develop .#ci --command zig build web-packages \
            -Doptimize=ReleaseFast \
            --cache-dir .cache/zig-local \
            --global-cache-dir .cache/zig-global

      - name: Smoke-test the packed editor in Chromium
        run: |
          nix develop .#ci --command zig build test-editor-browser \
            -Doptimize=ReleaseFast \
            --cache-dir .cache/zig-local \
            --global-cache-dir .cache/zig-global

      - name: Test the cross-origin LSP worker in Chromium
        run: |
          nix develop .#ci --command zig build test-lsp-cross-origin \
            -Doptimize=ReleaseFast \
            --cache-dir .cache/zig-local \
            --global-cache-dir .cache/zig-global

      # The pages workflow builds the manual too, but only on push to main.
      # Building it here catches a broken chapter or preprocessor on the PR.
      - name: Build the manual
        run: nix develop .#ci --command mdbook build manual

      # Compile every live cell in the manual and diff the per-document report
      # against the checked-in baseline. Some cells fail by design (error
      # demonstrations, cells left holding a search placeholder), so the gate is
      # the diff, not universal green — see manual/scripts/check-cells.mjs for
      # how to regenerate the baseline.
      - name: Check manual cells against the baseline
        run: |
          nix develop .#ci --command bash -euo pipefail -c '
            node manual/scripts/check-cells.mjs --abc zig-out/bin/abc \
              > "$RUNNER_TEMP/cells.actual"
            diff -u manual/cells.expected "$RUNNER_TEMP/cells.actual"
          '
